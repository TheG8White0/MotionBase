name: PhysioData validation
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install validation dependency
        run: python -m pip install -r requirements-validation.txt
      - name: Regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate database and public scope
        run: python -B scripts/validate.py
      - name: Validate accepted IDs and revisions against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python -B scripts/validate.py --base-ref "$BASE_REF"
